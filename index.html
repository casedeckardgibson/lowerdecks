  say([[DEF[B.e.k].n, `${atk.txt}\n\n${d} damage. +${heatGain} Ava Heat.`]], () => {
    bars();
    B.brace = false;

    if (climaxNow) {
      say([
        ['Ava', "The stimulation pushes her over the edge. Ava cums helplessly while the infected is still on her — a loud, broken moan, legs giving out, completely open."],
        ['', "She loses her next turn. Heat crashes hard afterward."]
      ], () => {
        P.heat = 30;
        P.climaxed = true;
        bars();
        if (P.hp <= 0) lose();
        else menu();
      });
      return;
    }

    if (P.hp <= 0) lose();
    else menu();
  });
}

function endBattle() {
  $('bt').classList.add('hide');
  $('por').classList.add('hide');
  $('menu').classList.add('hide');
  S = 'explore';
  P.overstim = P.heat >= 70;
  $('hud').textContent = `HP ${P.hp}   Heat ${P.heat}${P.overstim ? ' ⚠' : ''}   Flasks ${P.fl}`;
}

function lose() {
  $('bt').classList.add('hide');
  $('por').classList.add('hide');
  S = 'dead';
  endScreen('You succumbed to the dark…', 'Try again', () => {
    $('end').classList.add('hide');
    P.hp = 100; P.heat = 0; P.overstim = false; P.climaxed = false;
    P.x = Math.max(160, P.x - 280);
    B.e.cd = 7; S = 'explore';
  });
}

function endScreen(msg, btn, cb) {
  $('end').classList.remove('hide');
  $('end').innerHTML = `<div>${msg}</div><button style="font-size:17px;padding:11px 26px">${btn}</button>`;
  $('end').querySelector('button').onclick = cb;
}

function win() {
  S = 'win';
  endScreen('You reached the exit. The lower decks are behind you… for now.', 'Play again', () => location.reload());
}

function update(dt) {
  T += dt;
  if (S !== 'explore') return;

  let dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  P.mv = !!(dx || dy);

  if (P.mv) {
    const n = Math.hypot(dx, dy) || 1;
    P.x = Math.max(40, Math.min(LW - 40, P.x + dx / n * 155 * dt));
    P.y = Math.max(FT + 55, Math.min(FB, P.y + dy / n * 115 * dt));
    P.t += dt;
    P.dir = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'front' : 'back');
  } else P.t = 0;

  for (const e of ens) {
    if (e.dead) continue;
    e.cd = Math.max(0, e.cd - dt);
    const dx2 = P.x - e.x, dy2 = (P.y - e.y) * 2, dist = Math.hypot(dx2, dy2);
    if (dist < 310 && e.cd <= 0) {
      e.x += Math.sign(dx2) * 58 * dt;
      e.y += Math.sign(P.y - e.y) * 36 * dt;
      e.vx = Math.sign(dx2) * 30;
    } else {
      e.x += e.vx * dt;
      if (Math.abs(e.x - e.hx) > 160) e.vx *= -1;
    }
    if (dist < 64 && e.cd <= 0) { startBattle(e); return; }
  }

  if (P.x > LW - 130) { S = 'talk'; win(); }
  cam = Math.max(0, Math.min(LW - VW, P.x - VW * 0.45));
}

function scl(y) { return 0.78 + 0.42 * (y - FT) / (FB - FT); }

function dspr(img, x, y, h, flip) {
  if (!img) return;
  const w = (img.width || img.naturalWidth) * h / (img.height || img.naturalHeight);
  c.save();
  c.translate(x, y);
  if (flip) c.scale(-1, 1);
  c.drawImage(img, -w / 2, -h, w, h);
  c.restore();
}

function lampF(L) {
  let f = 0.85 + 0.15 * Math.sin(T * 13 + L.ph) * Math.sin(T * 5.3 + L.ph);
  if (Math.sin(T * 2.1 + L.ph * 2) > 0.96) f *= 0.25;
  return f;
}

function shadow(x, y, s) {
  let nl = lamps[0];
  for (const L of lamps) if (Math.abs(L.x - x) < Math.abs(nl.x - x)) nl = L;
  const o = (x - nl.x) * 0.1, r = (32 + Math.abs(x - nl.x) * 0.05) * s;
  c.fillStyle = 'rgba(0,0,0,.5)';
  c.beginPath();
  c.ellipse(x - cam + o, y, Math.min(r, 100), 8 * s, 0, 0, 7);
  c.fill();
}

function draw() {
  c.clearRect(0, 0, VW, VH);

  let g = c.createLinearGradient(0, 0, 0, FT);
  g.addColorStop(0, '#05090c'); g.addColorStop(1, '#16222a');
  c.fillStyle = g; c.fillRect(0, 0, VW, FT);
  for (let x = -((cam * 0.5) % 220); x < VW; x += 220) {
    c.fillStyle = '#0b1318'; c.fillRect(x, 0, 26, FT);
    c.fillStyle = '#1f2f38'; c.fillRect(x + 24, 0, 2, FT);
  }
  c.fillStyle = '#223038'; c.fillRect(0, 95, VW, 9); c.fillRect(0, 140, VW, 5);
  c.fillStyle = '#34464f'; c.fillRect(0, 95, VW, 2);

  g = c.createLinearGradient(0, FT, 0, VH);
  g.addColorStop(0, '#141c21'); g.addColorStop(1, '#030506');
  c.fillStyle = g; c.fillRect(0, FT, VW, VH - FT);
  c.strokeStyle = '#1d2a31'; c.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const y = FT + Math.pow(i / 7, 1.7) * (VH - FT);
    c.beginPath(); c.moveTo(0, y); c.lineTo(VW, y); c.stroke();
  }
  for (let i = -4; i < 30; i++) {
    const wx = i * 140 - (cam % 140) - 140 + 140;
    c.beginPath(); c.moveTo(wx, FT); c.lineTo((wx - 480) * 1.7 + 480, VH); c.stroke();
  }

  for (const k of crates) {
    const x = k.x - cam;
    if (x < -120 || x > VW + 60) continue;
    c.fillStyle = '#10181c'; c.fillRect(x, FT - k.h + 8, k.w, k.h);
    c.fillStyle = '#26363e'; c.fillRect(x, FT - k.h + 8, k.w, 3);
    c.fillStyle = '#070b0d'; c.fillRect(x + k.w - 5, FT - k.h + 8, 5, k.h);
  }

  const dx = LW - 60 - cam;
  c.fillStyle = '#0d2a1c'; c.fillRect(dx - 30, FT - 170, 90, 185);
  c.fillStyle = '#3cff9a'; c.globalAlpha = 0.55 + 0.15 * Math.sin(T * 3);
  c.fillRect(dx - 20, FT - 160, 70, 165); c.globalAlpha = 1;

  // Smaller, sharper sprites
  const D = [
    { y: P.y, x: P.x, s: scl(P.y), f: () => {
      const frames = SPR.walk[P.dir];
      if (frames && frames.length) {
        const i = P.mv ? Math.floor(P.t * 9) % frames.length : 0;
        dspr(frames[i], P.x - cam, P.y, 195 * scl(P.y), false); // reduced from ~255
      } else if (SPR.frontIdle) {
        dspr(SPR.frontIdle, P.x - cam, P.y, 195 * scl(P.y));
      }
    }}
  ];

  if (SPR.npc) {
    D.push({ y: npc.y, x: npc.x, s: scl(npc.y), f: () => dspr(SPR.npc, npc.x - cam, npc.y, 185 * scl(npc.y)) });
  }

  for (const e of ens) {
    if (e.dead) continue;
    const def = DEF[e.k];
    const img = e.vx < 0 && SPR[def.sprL] ? SPR[def.sprL] : SPR[def.sprF];
    D.push({ y: e.y, x: e.x, s: scl(e.y), f: () => dspr(img, e.x - cam, e.y, 185 * scl(e.y), e.vx < 0 && !SPR[def.sprL]) });
  }

  D.sort((a, b) => a.y - b.y);
  for (const o of D) { shadow(o.x, o.y, o.s); o.f(); }

  c.globalCompositeOperation = 'lighter';
  for (const L of lamps) {
    const f = lampF(L), x = L.x - cam;
    if (x < -300 || x > VW + 300) continue;
    g = c.createRadialGradient(x, 70, 0, x, 70, 300 * f);
    g.addColorStop(0, 'rgba(255,170,90,.22)');
    g.addColorStop(1, 'rgba(255,170,90,0)');
    c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  }
  c.globalCompositeOperation = 'source-over';

  const lc = document.createElement('canvas');
  lc.width = VW; lc.height = VH;
  const l = lc.getContext('2d');
  l.fillStyle = 'rgba(0,0,4,.93)';
  l.fillRect(0, 0, VW, VH);
  l.globalCompositeOperation = 'destination-out';
  const cut = (x, y, r, a) => {
    const gg = l.createRadialGradient(x, y, r * 0.1, x, y, r);
    gg.addColorStop(0, `rgba(0,0,0,${a})`);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    l.fillStyle = gg; l.fillRect(x - r, y - r, r * 2, r * 2);
  };
  for (const L of lamps) {
    cut(L.x - cam, 150, 330 * lampF(L), 0.95);
    cut(L.x - cam, FT + 60, 260 * lampF(L), 0.8);
  }
  cut(P.x - cam, P.y - 90, 200, 0.85);
  c.drawImage(lc, 0, 0);

  for (const e of ens) {
    if (e.dead) continue;
    c.fillStyle = `rgba(255,40,40,${0.35 + 0.3 * Math.sin(T * 4 + e.ph)})`;
    const s = scl(e.y);
    c.fillRect(e.x - cam - 7 * s, e.y - 165 * s, 3.5, 2.5);
    c.fillRect(e.x - cam + 4 * s, e.y - 165 * s, 3.5, 2.5);
  }

  c.fillStyle = 'rgba(180,200,210,.25)';
  for (const m of motes) {
    const x = (m.x - cam * 0.9 + Math.sin(T * m.s + m.y) * 20 + LW * 2) % LW;
    if (x < VW) c.fillRect(x, (m.y + T * m.s * 6) % VH, m.r, m.r);
  }

  g = c.createRadialGradient(480, 270, 200, 480, 270, 640);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.75)');
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);

  if (S === 'explore' && Math.hypot(P.x - npc.x, (P.y - npc.y) * 2) < 110) {
    c.fillStyle = '#f1d9d0'; c.font = '15px Georgia';
    c.fillText('[E] Talk', npc.x - cam - 24, npc.y - 200 * scl(npc.y));
  }
}

document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'KeyE' && S === 'explore' && Math.hypot(P.x - npc.x, (P.y - npc.y) * 2) < 110) {
    S = 'talk';
    say([
      ['Survivor', "You’re still human… good. Take this flask. The infected get distracted if you play with them. Tease them. It buys you time."],
      ['Survivor', "Their heat builds too. When they’re worked up they hit harder but also leave themselves open. Watch your own Heat — past 70 % you start losing control. At 100 % you’ll cum whether you want to or not."]
    ], () => { P.fl = Math.min(3, P.fl + 1); S = 'explore'; });
  }
});
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let last = performance.now();
function loop(n) {
  const dt = Math.min(0.05, (n - last) / 1000);
  last = n;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

(async () => {
  await loadAll();
  $('hud').textContent = `HP ${P.hp}   Heat ${P.heat}   Flasks ${P.fl}`;
  S = 'explore';
  say([['System', "Lower decks. The lights are dying. Red eyes move in the dark.\nReach the green door at the far end.\nKeep your Heat under control… or the infected will use it against you."]], () => {});
  requestAnimationFrame(loop);
})();

function resize() {
  const s = Math.min(window.innerWidth / 960, window.innerHeight / 540);
  $('fit').style.transform = `scale(${s})`;
  $('fit').style.left = ((window.innerWidth - 960 * s) / 2) + 'px';
  $('fit').style.top = ((window.innerHeight - 540 * s) / 2) + 'px';
}
window.addEventListener('resize', resize);
resize();
</script>
</body>
